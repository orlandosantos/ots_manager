[tool.ruff]
target-version = "py39"

[tool.ruff.lint]
# Explicit selection so a future Ruff release changing its own defaults
# can't silently change what CI enforces.
# E4/E7/E9: pycodestyle error subset, F: Pyflakes.
# Indentation/line-length rules (E1xx/E501) are intentionally left out:
# this codebase uses 2-space indentation, not PEP 8's 4-space convention.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
addopts = "--cov=ots_manager --cov-report=term-missing"
